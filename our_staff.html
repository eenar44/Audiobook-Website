<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Meta Elements -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Meta elements for SEO -->
    <meta name="description"
        content="Meet the dedicated team behind Online Audio Books. Our passionate staff ensures a seamless audiobook browsing and purchasing experience with top-tier customer support and content management.">
    <meta name="keywords"
        content="audiobook team, audiobook staff, audiobook professionals, customer support, content management, audio production, audiobook marketing, audiobook website team, audiobook service, audiobook experts, audiobook industry professionals">
    <meta name="author" content="Online Audio Books">

    <!-- Favicon link -->
    <link rel="icon" href="Graphics/favicon.png" type="image/png">

    <!-- Fonts -->
    <!-- Playfair -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair:ital,opsz,wght@0,5..1200,300..900;1,5..1200,300..900&family=Press+Start+2P&display=swap"
        rel="stylesheet">

    <!-- Nunito -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
        rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/SlickNav/1.0.10/slicknav.min.css">

    <!-- Script -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

    <title>Our Staff | Online Audio Books</title>
</head>

<body>
    <!-- Header and Navigation Bar -->
    <header id="navbar-placeholder"></header>

    <main>
        <!-- Our Staff Heading with content -->
        <h2>Our Staff</h2>
        <p>Our dedicated staff plays a role in ensuring that users have a seamless and enjoyable experience while
            browsing and purchasing audiobooks.</p>
        <p>Each member of our team is committed to providing excellent customer service and maintaining the quality of
            our audiobook offerings.</p>

        <!-- Scrollable Staff Section -->
        <section class="scroll-container">
            <article class="scroll-wrapper">
                <!-- Entire container enclosed as a table -->
                <table class="scroll-table">
                    <tbody>
                        <!-- One row -->
                        <tr>
                            <!-- multiple elements in the row -->
                            <td class="scroll-table-card">
                                <figure>
                                    <!-- Contains an image with a caption title and content for each card -->
                                    <img src="Graphics/profile.jpg" alt="Jane Harris Profile">
                                    <figcaption>
                                        <h4>Jane Harris</h4>
                                        <p>Chief Content Officer</p>
                                    </figcaption>
                                </figure>
                            </td>
                            <td class="scroll-table-card">
                                <figure>
                                    <img src="Graphics/profile.jpg" alt="Tom Roberts Profile">
                                    <figcaption>
                                        <h4>Tom Roberts</h4>
                                        <p>Customer Support Manager</p>
                                    </figcaption>
                                </figure>
                            </td>
                            <td class="scroll-table-card">
                                <figure>
                                    <img src="Graphics/profile.jpg" alt="Lucy Green Profile">
                                    <figcaption>
                                        <h4>Lucy Green</h4>
                                        <p>Audio Production Manager</p>
                                    </figcaption>
                                </figure>
                            </td>
                            <td class="scroll-table-card">
                                <figure>
                                    <img src="Graphics/profile.jpg" alt="Kevin Black Profile">
                                    <figcaption>
                                        <h4>Kevin Black</h4>
                                        <p>Marketing and Promotions</p>
                                    </figcaption>
                                </figure>
                            </td>
                            <td class="scroll-table-card">
                                <figure>
                                    <img src="Graphics/profile.jpg" alt="Sophie Lee Profile">
                                    <figcaption>
                                        <h4>Sophie Lee</h4>
                                        <p>Website Developer</p>
                                    </figcaption>
                                </figure>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </article>

            <!-- Buttons at the bottom of the container used to scroll through the cards -->
            <section class="scroll-buttons">
                <button id="scroll-left" class="scroll-btn" aria-label="Scroll Left">←</button>
                <button id="scroll-right" class="scroll-btn" aria-label="Scroll Right">→</button>
            </section>
        </section>

        <!-- Decorative Circle to the right top corner-->
        <div class="circle-container" id="right-circle"></div>
    </main>

    <!-- Footer -->
    <footer id="footer-placeholder"></footer>

    <!-- Script link for slicknav -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/SlickNav/1.0.10/jquery.slicknav.min.js"></script>

    <!-- Link to JS -->
    <script src="script.js"></script>
</body>

</html>
